events {}

http {
	include /etc/nginx/mime.types;
	access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

	#upstream backend {
  #  server backend:8000;
  #}

 	server {
   	listen 0.0.0.0:80;
   	server_name localhost;

   	location / {
 	    root /var/www/html;
 	    index index.html;
 	    try_files $uri $uri/ /index.html;
   	}

   	#location /api {
    #  proxy_pass http://backend;
   	#}
  }
}
